name: Publish reviewed AEC release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to publish
        required: true
        type: string
      expected_revision:
        description: Expected full commit SHA after tag dereference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aec-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve authenticated release evidence
        id: release-inputs
        env:
          GH_TOKEN: ${{ secrets.AEC_RELEASE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REVISION: ${{ github.sha }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_REVISION: ${{ inputs.expected_revision }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$DISPATCH_TAG"
            expected_revision="$DISPATCH_REVISION"
          else
            release_tag="$PUSH_TAG"
            expected_revision="$PUSH_REVISION"
          fi
          python3 tools/release_api_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$release_tag" \
            --expected-revision "$expected_revision" \
            --output "$RUNNER_TEMP/aec-release-publication-evidence.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out validated exact tag revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          path: release-candidate
          persist-credentials: false
          ref: ${{ steps.release-inputs.outputs.revision }}

      - name: Validate exact release candidate
        working-directory: release-candidate
        run: |
          set -euo pipefail
          python3 tools/validate_foundation.py
          python3 -m unittest discover -s tests -v

      - name: Generate immutable release asset
        working-directory: release-candidate
        env:
          RELEASE_TAG: ${{ steps.release-inputs.outputs.release_tag }}
          RELEASE_REVISION: ${{ steps.release-inputs.outputs.revision }}
        run: |
          set -euo pipefail
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 tools/release_manifest.py generate \
            --descriptor config/release/aec-release.json \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$RELEASE_REVISION" \
            --tag "$RELEASE_TAG" \
            --published-at "$published_at" \
            --output aec-release-manifest.json
          python3 tools/release_manifest.py validate aec-release-manifest.json

      - name: Confirm closed publication preflight
        env:
          GH_TOKEN: ${{ secrets.AEC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release-inputs.outputs.release_tag }}
          RELEASE_REVISION: ${{ steps.release-inputs.outputs.revision }}
        run: |
          set -euo pipefail
          python3 tools/release_api_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --expected-revision "$RELEASE_REVISION" \
            --output "$RUNNER_TEMP/aec-release-publication-evidence.json"
          python3 release-candidate/tools/release_manifest.py preflight \
            --descriptor release-candidate/config/release/aec-release.json \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$RELEASE_REVISION" \
            --tag "$RELEASE_TAG" \
            --main-contains-revision true \
            --immutable-releases-enabled true \
            --existing-release-state missing \
            --token-available true

      - name: Stage and publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.AEC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release-inputs.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "AEC $RELEASE_TAG" \
            --notes-file "release-candidate/docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "release-candidate/aec-release-manifest.json#AEC release manifest" \
            "release-candidate/schemas/release-manifest.schema.json#Release manifest schema" \
            "$RUNNER_TEMP/aec-release-publication-evidence.json#Publication preflight evidence"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
