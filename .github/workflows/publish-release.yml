name: Publish reviewed AEC release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: aec-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact tag revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate exact release candidate
        run: |
          set -euo pipefail
          python3 tools/validate_foundation.py
          python3 -m unittest discover -s tests -v

      - name: Generate immutable release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 tools/release_manifest.py generate \
            --descriptor config/release/aec-release.json \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --published-at "$published_at" \
            --output aec-release-manifest.json
          python3 tools/release_manifest.py validate aec-release-manifest.json

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.AEC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            TOKEN_AVAILABLE=false
          else
            TOKEN_AVAILABLE=true
          fi
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            MAIN_CONTAINS_REVISION=true
          else
            MAIN_CONTAINS_REVISION=false
          fi
          ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --header "X-GitHub-Api-Version: 2026-03-10" --jq .enabled)
          RELEASE_ERROR=$(mktemp)
          if DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>"$RELEASE_ERROR"); then
            if [ "$DRAFT" = "true" ]; then
              EXISTING_RELEASE_STATE=draft
            else
              EXISTING_RELEASE_STATE=published
            fi
          elif grep -q "HTTP 404" "$RELEASE_ERROR"; then
            EXISTING_RELEASE_STATE=missing
          else
            cat "$RELEASE_ERROR" >&2
            exit 1
          fi
          python3 tools/release_manifest.py preflight \
            --descriptor config/release/aec-release.json \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --main-contains-revision "$MAIN_CONTAINS_REVISION" \
            --immutable-releases-enabled "$ENABLED" \
            --existing-release-state "$EXISTING_RELEASE_STATE" \
            --token-available "$TOKEN_AVAILABLE"

      - name: Stage and publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.AEC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "AEC $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "AEC $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "aec-release-manifest.json#AEC release manifest" \
            "schemas/release-manifest.schema.json#Release manifest schema"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
