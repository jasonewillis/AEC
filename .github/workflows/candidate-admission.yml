name: Candidate admission bootstrap

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  bootstrap-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out immutable base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify dormant base admission root
        run: python3 -m tools.admission_root_v1 --self-check --root .
